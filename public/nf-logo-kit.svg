      <g fill="#4C6FFF"><rect x="78" y="0" width="50" height="16"/><rect x="78" y="40" width="34" height="16"/></g>
    </g>
  </g>

  <g id="02 Warna - latar terang" transform="translate(520 0)">
    <rect width="480" height="400" rx="24" fill="#F4F2EC"/>
    <g transform="translate(80 75) scale(2.5)">
      <path d="M0 100V0h21l39 68.42V0h18v100H57L18 31.58V100z" fill="#111214"/>
      <g fill="#4C6FFF"><rect x="78" y="0" width="50" height="16"/><rect x="78" y="40" width="34" height="16"/></g>
    </g>
  </g>

  <g id="03 Satu warna - di aksen" transform="translate(1040 0)">
    <rect width="480" height="400" rx="24" fill="#4C6FFF"/>
