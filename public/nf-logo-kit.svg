      <rect x="225" y="52" width="2" height="96" fill="#DDDAD0"/>
      <text x="258" y="112" font-family="Space Grotesk" font-weight="700" font-size="56" letter-spacing="-1.1" fill="#111214">Nanda Febian</text>
      <text x="260" y="148" font-family="JetBrains Mono" font-size="20" fill="#5E5E64">software developer</text>
    </g>
